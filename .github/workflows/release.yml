# Desktop installers (macOS arm64 + Intel, Windows x64, Linux x64).
# A tag v* builds them and attaches the files to a GitHub Release.
# The README download buttons use those stable file names.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            args: --mac --arm64 --x64
          - os: windows-latest
            platform: win
            args: --win --x64
          - os: ubuntu-latest
            platform: linux
            args: --linux --x64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Install dependencies
        run: npm ci

      - name: Package
        env:
          # Windows has no certificate. macOS uses an ad-hoc signature
          # (package.json mac.identity "-"); forcing discovery off would
          # strip that signature and make Gatekeeper call the app damaged.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'win' && 'false' || 'true' }}
        run: npm run build && npx electron-builder ${{ matrix.args }} --publish never

      - name: Check the macOS signature
        if: matrix.platform == 'mac'
        run: |
          find dist-electron -name 'Skeepto.app' -type d -maxdepth 3 -print -exec codesign --verify --deep --strict {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.exe
            dist-electron/*.AppImage
            dist-electron/*.deb

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Skeepto ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
