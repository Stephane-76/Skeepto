<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Grid icon - table/grid layout -->
  <!-- Border -->
  <rect x="4" y="4" width="56" height="56" rx="2" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Horizontal dividers -->
  <line x1="4" y1="20" x2="60" y2="20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="4" y1="36" x2="60" y2="36" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="4" y1="52" x2="60" y2="52" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Vertical dividers -->
  <line x1="20" y1="4" x2="20" y2="60" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="36" y1="4" x2="36" y2="60" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="4" x2="52" y2="60" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
</svg>

