<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rectangle -->
  <rect x="2" y="2" width="60" height="60" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  
  <!-- Grid lines -->
  <!-- Row headers background -->
  <rect x="2" y="2" width="14" height="58" fill="#f5f5f5"/>
  
  <!-- Horizontal lines (rows) -->
  <line x1="2" y1="14" x2="62" y2="14" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="2" y1="26" x2="62" y2="26" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="2" y1="38" x2="62" y2="38" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="2" y1="50" x2="62" y2="50" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- Vertical lines (columns) -->
  <line x1="16" y1="2" x2="16" y2="62" stroke="#d0d0d0" stroke-width="1"/>
  <line x1="28" y1="2" x2="28" y2="62" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="40" y1="2" x2="40" y2="62" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="52" y1="2" x2="52" y2="62" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- Row numbers -->
  <text x="8" y="23" text-anchor="middle" font-size="8" fill="#666" font-family="Arial, sans-serif">1</text>
  <text x="8" y="35" text-anchor="middle" font-size="8" fill="#666" font-family="Arial, sans-serif">2</text>
  <text x="8" y="47" text-anchor="middle" font-size="8" fill="#666" font-family="Arial, sans-serif">3</text>
  <text x="8" y="59" text-anchor="middle" font-size="8" fill="#666" font-family="Arial, sans-serif">4</text>
  
  <!-- Column headers -->
  <text x="22" y="11" text-anchor="middle" font-size="7" fill="#666" font-family="Arial, sans-serif" font-weight="bold">A</text>
  <text x="34" y="11" text-anchor="middle" font-size="7" fill="#666" font-family="Arial, sans-serif" font-weight="bold">B</text>
  <text x="46" y="11" text-anchor="middle" font-size="7" fill="#666" font-family="Arial, sans-serif" font-weight="bold">C</text>
  <text x="58" y="11" text-anchor="middle" font-size="7" fill="#666" font-family="Arial, sans-serif" font-weight="bold">D</text>
</svg>
