<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Grid icon - table/grid layout -->
  <!-- Border -->
  <rect x="3" y="3" width="42" height="42" rx="1.5" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"/>
  
  <!-- Horizontal dividers -->
  <line x1="3" y1="15" x2="45" y2="15" stroke="currentColor" stroke-width="1.875" stroke-linecap="round"/>
  <line x1="3" y1="27" x2="45" y2="27" stroke="currentColor" stroke-width="1.875" stroke-linecap="round"/>
  <line x1="3" y1="39" x2="45" y2="39" stroke="currentColor" stroke-width="1.875" stroke-linecap="round"/>
  
  <!-- Vertical dividers -->
  <line x1="15" y1="3" x2="15" y2="45" stroke="currentColor" stroke-width="1.875" stroke-linecap="round"/>
  <line x1="27" y1="3" x2="27" y2="45" stroke="currentColor" stroke-width="1.875" stroke-linecap="round"/>
  <line x1="39" y1="3" x2="39" y2="45" stroke="currentColor" stroke-width="1.875" stroke-linecap="round"/>
</svg>

